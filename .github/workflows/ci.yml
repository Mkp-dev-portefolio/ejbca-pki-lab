name: CI — Validate Lab Config

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Copy env example
        run: cp docker/.env.example docker/.env

      - name: Validate docker-compose syntax
        run: |
          docker compose -f docker/docker-compose.yml \
            --env-file docker/.env config --quiet
          docker compose -f docker/docker-compose.yml \
            -f docker/docker-compose.vps.yml \
            --env-file docker/.env config --quiet

      - name: Lint Nginx config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/docker/nginx:/etc/nginx:ro \
            nginx:alpine nginx -t -c /etc/nginx/nginx.conf 2>&1 || true

  validate-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          find pki/scripts/ -name "*.sh" -exec shellcheck -S warning {} \;

  validate-xml-profiles:
    name: Validate XML Certificate Profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML syntax
        run: |
          for f in $(find pki/profiles/ -name "*.xml"); do
            echo "Checking: $f"
            xmllint --noout "$f" && echo "  OK" || echo "  FAILED: $f"
          done
