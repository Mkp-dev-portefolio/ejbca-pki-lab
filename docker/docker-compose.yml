# =============================================================================
# EJBCA PKI Lab — Docker Compose Stack
# Services: MariaDB | EJBCA CE | Nginx Reverse Proxy
# =============================================================================


x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ---------------------------------------------------------------------------
  # DATABASE — MariaDB
  # Named volume used (not bind-mount) for full native I/O speed on macOS
  # ---------------------------------------------------------------------------
  ejbca-database:
    image: ${DB_IMAGE:-mariadb}:${DB_VERSION:-10.11}
    container_name: ejbca-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ejbca}
      MYSQL_USER: ${DB_USER:-ejbca}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - ejbca-internal
    healthcheck:
      test: ["CMD-SHELL", "mariadb -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PKI ENGINE — EJBCA Community Edition
  # ---------------------------------------------------------------------------
  ejbca-node1:
    image: ${EJBCA_IMAGE:-keyfactor/ejbca-ce}:${EJBCA_VERSION:-latest}
    container_name: ejbca-node1
    restart: unless-stopped
    depends_on:
      ejbca-database:
        condition: service_healthy
    environment:
      # Database
      DATABASE_JDBC_URL: "jdbc:mariadb://ejbca-database:3306/${DB_NAME:-ejbca}?characterEncoding=UTF-8"
      DATABASE_USER: ${DB_USER:-ejbca}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      # TLS & Startup
      TLS_SETUP_ENABLED: ${TLS_SETUP_ENABLED:-true}
      # JVM entropy source — use non-blocking /dev/urandom to avoid 300s startup timeout
      JAVA_SECURITY_USE_URANDOM: ${JAVA_SECURITY_USE_URANDOM:-force}
      # Extend WildFly deployment stability timeout (default 300s too short on cold start)
      APPSERVER_DEPLOYMENT_TIMEOUT: ${APPSERVER_DEPLOYMENT_TIMEOUT:-600}
      # Logging
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SERVER: ${LOG_LEVEL_SERVER:-WARN}
      LOG_STORAGE_LOCATION: "/opt/keyfactor/appserver/standalone/log"
      # Hostname
      PROXY_HTTP_BIND: "0.0.0.0"
    volumes:
      - ejbca-data:/mnt/persistent:rw
      # Override standalone.conf to set -Djboss.as.management.blocking.timeout=600
      - ./configs/standalone.conf:/opt/keyfactor/wildfly-35.0.1.Final/bin/standalone.conf:ro
    ports:
      # PROXY_HTTP_BIND=0.0.0.0 → EJBCA runs on proxy listeners 8081 (HTTP) and 8082 (HTTPS proxy)
      # 8081 = plain HTTP proxy listener (EJBCA behind reverse proxy)
      # 8082 = HTTPS proxy listener (TLS terminated upstream by Nginx)
      - "${EJBCA_HTTP_PORT:-8081}:8081"
      - "${EJBCA_HTTPS_PORT:-8082}:8082"
    networks:
      - ejbca-internal
      - ejbca-public
    healthcheck:
      # EJBCA with PROXY_HTTP_BIND uses proxy listener on 8081 (HTTP)
      test: ["CMD", "curl", "-sf", "http://localhost:8081/ejbca/publicweb/healthcheck/ejbcahealth"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # REVERSE PROXY — Nginx
  # Terminates external TLS and forwards to EJBCA
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ejbca-nginx
    restart: unless-stopped
    depends_on:
      ejbca-node1:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/nginx/certs:/etc/nginx/certs:ro
      - ./data/nginx/logs:/var/log/nginx
    networks:
      - ejbca-public
    environment:
      - EJBCA_HOSTNAME=${EJBCA_HOSTNAME:-ejbca.lab.local}
    logging: *default-logging

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  ejbca-internal:
    driver: bridge
    internal: true        # Database not reachable from outside
  ejbca-public:
    driver: bridge

# =============================================================================
# VOLUMES (named, for easy backup)
# =============================================================================
volumes:
  ejbca-data:
    driver: local
  mariadb-data:
    driver: local
