# =============================================================================
# EJBCA Nginx Virtual Host
# Proxies EJBCA admin UI (8443), RA UI (8442), and public endpoints (8080)
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# EJBCA Admin UI — Client Certificate Authentication (port 8443 → /ca)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name ${EJBCA_HOSTNAME};

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Forward to EJBCA admin interface (mutual TLS — client cert required)
    location /ejbca/adminweb {
        proxy_pass https://ejbca-node1:8443;
        proxy_ssl_verify off;       # Self-signed EJBCA cert
        proxy_ssl_server_name on;
        proxy_read_timeout 300;
    }

    # EJBCA Public Servlet (CRL, OCSP, CMP, EST)
    location /ejbca/publicweb {
        proxy_pass https://ejbca-node1:8443;
        proxy_ssl_verify off;
        proxy_read_timeout 120;
    }

    # EJBCA REST API
    location /ejbca/ejbca-rest-api {
        proxy_pass https://ejbca-node1:8443;
        proxy_ssl_verify off;
        proxy_read_timeout 120;
        # Optional: rate limiting for API
        # limit_req zone=api burst=20 nodelay;
    }
}

# ---------------------------------------------------------------------------
# EJBCA RA Web UI — HTTPS without mutual TLS (enrollment portal)
# ---------------------------------------------------------------------------
server {
    listen 8444 ssl;
    server_name ${EJBCA_HOSTNAME};

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /ejbca/ra {
        proxy_pass https://ejbca-node1:8442;
        proxy_ssl_verify off;
        proxy_read_timeout 120;
    }

    # EST endpoint (RFC 7030) — IoT enrollment
    location /.well-known/est {
        proxy_pass https://ejbca-node1:8442;
        proxy_ssl_verify off;
        proxy_read_timeout 120;
    }
}

# ---------------------------------------------------------------------------
# EJBCA CMP/SCEP/ACME — Protocol endpoints
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name ${EJBCA_HOSTNAME};

    # CRL distribution points (HTTP, not HTTPS, per RFC)
    location /ejbca/publicweb/crls {
        proxy_pass http://ejbca-node1:8080;
        proxy_read_timeout 30;
    }

    # OCSP
    location /ejbca/publicweb/status/ocsp {
        proxy_pass http://ejbca-node1:8080;
        proxy_read_timeout 30;
    }
}
